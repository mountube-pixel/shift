<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PERCORSO — programma il robot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="ui/stile.css">
</head>
<body>
<div class="wrap">
  <div class="colCampo">
    <div class="schermo" id="schermo">
      <canvas id="stage"></canvas>
      <div class="tit"><b id="lvNome"></b><span id="lvGoal"></span></div>
      <div class="verdetto" id="verdetto"></div>
      <!-- da qui in giù: visibili solo nel replay a schermo intero -->
      <button class="chiudiPieno" id="chiudiPieno" aria-label="torna ai blocchi">✕</button>
      <div class="pannelloReplay" id="pannelloReplay">
        <div class="pr-testa">
          <span class="pr-titolo">comandi</span>
          <span class="pr-battiti" id="prBattiti"></span>
          <button class="pr-nascondi" id="prNascondi" aria-label="nascondi i comandi">✕</button>
        </div>
        <div class="pr-scorri" id="prScorri"></div>
      </div>
      <button class="mostraComandi" id="mostraComandi">📜 comandi</button>
      <div class="fineReplay" id="fineReplay">
        <button id="rivedi">↻ rivedi</button>
        <button id="tornaBlocchi" class="primario">✎ torna ai blocchi</button>
      </div>
    </div>
    <div class="comandi">
      <button id="vai">▶ VAI</button>
    </div>
    <div class="contatori" id="contatori"></div>
  </div>
  <div class="colProg">
    <div class="prog" id="prog"></div>
    <div class="palette" id="palette"></div>
  </div>
</div>
<script type="module" src="ui/app.js"></script>
</body>
</html>
